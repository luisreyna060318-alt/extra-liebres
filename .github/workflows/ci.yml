# Integración continua de Extra-Liebres.
# Se ejecuta en cada push y en cada pull request. Solo lee el repositorio (contents: read) y no usa secretos.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff y pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias del backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      # Se corre desde la raíz porque ruff.toml vive ahí (mismo comando que en backend/README.md)
      - name: Revisar estilo con ruff
        run: ruff check backend db

      # Las pruebas usan SQLite en memoria (ver backend/tests/conftest.py), por eso no hace falta PostgreSQL
      - name: Correr pruebas con pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Mientras el frontend no exista (frontend/package.json), los pasos de abajo se omiten sin fallar
      - name: Detectar si existe el frontend
        id: detectar
        run: |
          if [ -f frontend/package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json no existe todavia; se omiten los pasos del frontend."
          fi

      - name: Instalar Node 22 LTS
        if: steps.detectar.outputs.existe == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        if: steps.detectar.outputs.existe == 'true'
        working-directory: frontend
        run: npm ci

      - name: Revisar estilo del frontend
        if: steps.detectar.outputs.existe == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Compilar el frontend
        if: steps.detectar.outputs.existe == 'true'
        working-directory: frontend
        run: npm run build
