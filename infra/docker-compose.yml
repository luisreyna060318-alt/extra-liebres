# Servicios de Extra-Liebres: base de datos (PostgreSQL), backend (FastAPI) y frontend (React servido por nginx).
#
# Se usa desde la RAÍZ del repositorio, con el archivo compose.yaml que incluye este:
#   copy .env.example .env        (una sola vez; después edita .env si quieres otras claves)
#   docker compose up --build
#
# Las variables ${...} se leen del archivo .env de la raíz (ver compose.yaml).
name: extra-liebres

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Solo las 3 variables que PostgreSQL necesita (antes se le pasaba todo el .env, incluida la SECRET_KEY)
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Solo accesible desde esta computadora (127.0.0.1), nunca desde la red. Sirve para mirar las tablas.
    # Si ya tienes un PostgreSQL local usando el 5432, pon DB_HOST_PORT=5433 (u otro libre) en .env.
    # Solo cambia el puerto de tu computadora: entre contenedores sigue siendo el 5432.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..                      # la raíz del repo: la imagen necesita backend/ y db/
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy     # el backend arranca cuando PostgreSQL ya acepta conexiones
    environment:
      ENTORNO: ${ENTORNO:-desarrollo}
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CLIMA_URL: ${CLIMA_URL:-https://api.open-meteo.com/v1/forecast}
      CLIMA_UMBRAL_LLUVIA: ${CLIMA_UMBRAL_LLUVIA:-50}
      # Dentro de Docker la base de datos se llama "db" (el nombre del servicio de arriba)
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Datos de ejemplo y usuarios de prueba al arrancar (el seed se omite si las tablas ya tienen datos)
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_CORREO: ${SEED_ADMIN_CORREO:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_CAPTURISTA_CORREO: ${SEED_CAPTURISTA_CORREO:-}
      SEED_CAPTURISTA_PASSWORD: ${SEED_CAPTURISTA_PASSWORD:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      args:
        # Vite escribe esta URL dentro del código al compilar. Es la que usa el NAVEGADOR (no el contenedor),
        # por eso es localhost:8000 (el puerto del backend publicado en tu computadora) y no "backend".
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy     # el frontend arranca cuando la API ya responde
    # nginx dentro del contenedor escucha en el 8080; en tu computadora se abre en http://localhost:5173,
    # que es el origen que CORS_ORIGINS permite en el backend.
    ports:
      - "5173:8080"

volumes:
  pgdata:
