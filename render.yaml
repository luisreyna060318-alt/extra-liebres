# Blueprint de Render: describe el backend para no configurarlo a mano en el panel.
# Uso: en Render, New + > Blueprint > elige este repositorio. Render pide los valores marcados con "sync: false".
# Guía paso a paso: infra/DEPLOY.md
services:
  - type: web
    name: extra-liebres-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .                     # la raíz del repo: la imagen necesita backend/ y db/
    healthCheckPath: /api/health
    envVars:
      - key: ENTORNO
        value: produccion                # con esto el backend se niega a arrancar con claves de ejemplo
      - key: SECRET_KEY
        generateValue: true              # Render genera una clave aleatoria larga; nadie la ve ni se sube a Git
      - key: DATABASE_URL
        sync: false                      # la pegas tú: la URL de conexión que da Neon
      - key: CORS_ORIGINS
        sync: false                      # la URL pública del frontend (Vercel), sin diagonal final
      - key: SEED_ON_START
        value: "true"                    # carga los datos de ejemplo (ficticios) si la base está vacía
      - key: SEED_ADMIN_CORREO
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false                      # una clave tuya, NO la del ejemplo (el seed la rechaza en producción)
      - key: SEED_CAPTURISTA_CORREO
        sync: false
      - key: SEED_CAPTURISTA_PASSWORD
        sync: false
      - key: CLIMA_UMBRAL_LLUVIA
        value: "50"
