# Configuración de nginx para servir la SPA de React.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los archivos de /assets/ llevan un código en el nombre (hash) que cambia con cada compilación,
    # así que el navegador puede guardarlos mucho tiempo.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router maneja las rutas en el navegador (/grupos, /alumnos/3...). Si el archivo no existe en disco,
    # se devuelve index.html para que al recargar la página no salga 404.
    location / {
        try_files $uri /index.html;
        # index.html no se guarda en caché: así siempre apunta a los archivos de la última versión
        add_header Cache-Control "no-cache";
    }
}
