<rect class="notas" x="740" y="920" width="560" height="272" rx="10"/>
<text class="nombre2" x="756" y="954">Cómo leer el diagrama</text>
<text class="nota" x="756" y="984">PK llave primaria · FK llave foránea · UQ valor único</text>
<text class="nota" x="756" y="1008">Las columnas sin la marca NULL son obligatorias (NOT NULL).</text>
<text class="nota" x="756" y="1032">1 —— N  relación uno a muchos: la N es la tabla que tiene la FK.</text>
<text class="nota" x="756" y="1056">Todas las FK usan ON DELETE RESTRICT: no se puede borrar</text>
<text class="nota" x="756" y="1080">un catálogo, alumno ni grupo que ya tenga registros (RN-08).</text>
<text class="nota" x="756" y="1104">alumno_grupo: su PK es compuesta (nocontrol, idgrupo), así un</text>
<text class="nota" x="756" y="1128">alumno no se inscribe dos veces al mismo grupo.</text>
<text class="nota" x="756" y="1152">usuario no se relaciona con las demás tablas: son las cuentas</text>
<text class="nota" x="756" y="1176">de acceso (correo único, rol administrador o capturista).</text>
</svg>